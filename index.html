<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La fábrica de Schrödinger</title>
<style>
  html, body { margin: 0; background: #0b0b0b; }
  .reveal { opacity: 0; }
  textarea[data-template] { display: none !important; }
  #lang {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    margin: 0;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 13px;
    letter-spacing: .08em;
    background: #fafaf7;
    border: 1px solid #d6d6d0;
  }
  #lang button {
    font: inherit;
    color: #6d6d68;
    background: transparent;
    border: 0;
    margin: 0;
    padding: 7px 11px;
    cursor: pointer;
    appearance: none;
  }
  #lang button + button { border-left: 1px solid #d6d6d0; }
  #lang button[aria-pressed="true"] { color: #fafaf7; background: #0b0b0b; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.5"/>
    </pattern>
    <symbol id="arrow" viewBox="0 0 60 20"><line x1="0" y1="10" x2="56" y2="10"/><path d="M48 3 L 57 10 L 48 17"/></symbol>
  </defs>
</svg>

<div class="reveal">
  <div class="slides">
    <section data-markdown data-separator-notes="^Note:">
      <textarea data-template id="md-0"></textarea>
    </section>
    <section data-markdown data-separator-notes="^Note:">
      <textarea data-template id="md-1"></textarea>
    </section>
    <section data-markdown data-separator-notes="^Note:">
      <textarea data-template id="md-2"></textarea>
    </section>
    <section data-markdown data-separator-notes="^Note:">
      <textarea data-template id="md-3"></textarea>
    </section>
    <section data-markdown data-separator-notes="^Note:">
      <textarea data-template id="md-4"></textarea>
    </section>
  </div>
</div>
<div id="toast"></div>
<div id="lang" role="group" aria-label="Idioma">
  <button type="button" data-lang="es" aria-pressed="true">ES</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search).get('lang');
    var saved = null;
    try { saved = localStorage.getItem('lang'); } catch (e) {}
    var lang = q === 'es' || q === 'en' ? q : (saved === 'es' || saved === 'en' ? saved : 'es');
    document.querySelectorAll('#lang button').forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.getAttribute('data-lang') === lang));
    });
  })();
</script>

<script type="module" src="/main.js"></script>
</body>
</html>
